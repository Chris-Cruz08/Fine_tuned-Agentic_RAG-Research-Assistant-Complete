readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.1",
    "huggingface-hub>=1.27.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.11",
    "langsmith>=0.11.0",
    "mcp>=1.28.0",
    "mlflow>=3.15.1",
    "peft>=0.20.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "ragas<0.4",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.61.1",
    "tavily-python>=0.7.27",
    "torch>=2.13.0",
    "transformers>=5.15.0",
